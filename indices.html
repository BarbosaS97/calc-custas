<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Cálculo de Custas Processuais</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .aviso-pagina { max-width: 640px; margin: 12vh auto 0; }
        .aviso-pagina .conteudo { padding: 32px; }
        .aviso-pagina h2 { font-size: 18px; color: var(--primary-color); margin-bottom: 12px; }
        .aviso-pagina p { margin-bottom: 20px; }
        .aviso-pagina .btn { text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="container aviso-pagina">
        <header>
            <h1>Cálculo de Custas Processuais</h1>
        </header>
        <div class="conteudo">
            <h2>Sistema encerrado</h2>
            <p>O sistema oficial de cálculo de custas voltou à normalidade. Este sistema não está mais disponível. Acesse o cálculo pelo endereço oficial:</p>
            <a class="btn btn-primary" href="https://app.trf1.jus.br/calculo-custas/">https://app.trf1.jus.br/calculo-custas/</a>
        </div>
    </div>
</body>
</html>
