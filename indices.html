<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Cálculo de Custas Processuais</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .aviso-pagina { max-width: 640px; margin: 12vh auto 0; }
        .aviso-pagina .conteudo { padding: 32px; }
        .aviso-pagina h2 { font-size: 18px; color: var(--primary-color); margin-bottom: 12px; }
        .aviso-pagina p { margin-bottom: 20px; }
        .aviso-pagina { text-align: center; }
        .aviso-pagina .btn-oficial {
            display: block; padding: 18px 24px; background-color: var(--primary-color); color: #fff;
            font-size: 18px; font-weight: 600; text-decoration: none; border-radius: 4px;
            border-bottom: 4px solid var(--primary-dark); margin-bottom: 12px;
        }
        .aviso-pagina .btn-oficial:hover { background-color: var(--primary-dark); }
        .aviso-pagina .btn-oficial:focus-visible { outline: 3px solid #f0b429; outline-offset: 2px; }
        .aviso-pagina .url-oficial { font-size: 13px; color: var(--muted-color); }
    </style>
</head>
<body>
    <div class="container aviso-pagina">
        <header>
            <h1>Cálculo de Custas Processuais</h1>
        </header>
        <div class="conteudo">
            <h2>O sistema oficial de cálculo de custas voltou à normalidade</h2>
            <p>Faça o cálculo pelo sistema oficial.</p>
            <a class="btn-oficial" href="https://app.trf1.jus.br/calculo-custas/">Acesse o cálculo pelo endereço oficial &rarr;</a>
            <span class="url-oficial">https://app.trf1.jus.br/calculo-custas/</span>
        </div>
    </div>
</body>
</html>
